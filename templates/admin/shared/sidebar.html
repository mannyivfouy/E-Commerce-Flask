<aside class="admin-sidebar" id="adminSidebar" aria-label="Main navigation">
    <div class="sidebar-header">
        <a class="brand-mark" href="{{ url_for('admin_bp.dashboard') }}" aria-label="adminHMD dashboard">
            <span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span>
            <span class="brand-copy">
            <span class="brand-title">adminHMD</span>
            <span class="brand-subtitle">Admin Template</span>
          </span>
        </a>
    </div>

    <nav class="sidebar-nav">
        <a class="nav-link  {{ 'active' if module == 'dashboard' }}" href="{{ url_for('admin_bp.dashboard') }}"
           aria-current="page">
            <span class="nav-icon"><i class="bi bi-speedometer2" aria-hidden="true"></i></span>
            <span class="nav-text">Dashboard</span>
        </a>
        <a class="nav-link {{ 'active' if module == 'users' }}" href="{{ url_for('admin_bp.users') }}">
            <span class="nav-icon"><i class="bi bi-people" aria-hidden="true"></i></span>
            <span class="nav-text">Users</span>
        </a>

    </nav>

    <div class="sidebar-user">
        <img
                class="avatar-img avatar-md sidebar-user-avatar"
                src="{{ url_for('static', filename='uploads/' + session['profile']) }}"
                alt="{{ session['username'] }}"
        >

        <strong>{{ session['username'] }}</strong>

        <small>{{ session['role']|capitalize }}</small>
    </div>
</aside>
