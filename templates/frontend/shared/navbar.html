<nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-full mx-auto px-12">
        <div class="flex items-center justify-between h-16">

            <!-- Logo -->
            <a class="flex items-center gap-3 cursor-pointer"
               href="{{ url_for('front_bp.home') }}">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">
                    MS
                </div>

                <div>
                    <h1 class="text-lg font-bold text-gray-800">MarketStore</h1>
                    <p class="text-xs text-gray-500">Modern Shop</p>
                </div>
            </a>

            <!-- Menu -->
            <ul class="hidden md:flex items-center gap-8">
                <li>
                    <a href="{{ url_for('front_bp.home') }}"
                       class="text-gray-700 hover:text-indigo-600 font-medium transition">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('front_bp.products') }}"
                       class="text-gray-700 hover:text-indigo-600 font-medium transition">
                        Products
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('front_bp.account') }}"
                       class="text-gray-700 hover:text-indigo-600 font-medium transition">
                        Account
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('front_bp.cart') }}"
                       class="text-gray-700 hover:text-indigo-600 font-medium transition">
                        Cart
                    </a>
                </li>
            </ul>

            <!-- Right Side -->
            <div class="flex items-center gap-3">

                {% if session.get('user_id') %}

                <!-- Logged In -->
                <a href="{{ url_for('front_bp.account') }}"
                   class="text-gray-700 hover:text-indigo-600 font-medium transition">
                    My Account
                </a>

                <form action="{{ url_for('front_bp.logout') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <button type="submit"
                            class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-xl font-medium transition cursor-pointer">
                        Logout
                    </button>
                </form>

                {% else %}

                <!-- Guest -->
                <a href="{{ url_for('front_bp.login') }}"
                   class="text-indigo-600 hover:text-indigo-700 px-4 py-2 font-medium transition">
                    Sign In
                </a>

                <a href="{{ url_for('front_bp.create_account') }}"
                   class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-medium transition">
                    Sign Up
                </a>

                {% endif %}

            </div>

        </div>
